# Mirrors `mise run ci`. Tool versions come from mise.toml, so a green run here
# and a green run locally use the same Go and the same golangci-lint — the whole
# reason those versions are pinned.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch. Pushing twice in a minute — which is what happens when an
# agent amends a commit after CI has already started — otherwise leaves the
# first run grinding through three jobs whose answer nobody will read.
#
# Not applied to main: a superseded run there is the record of whether that
# commit was good, and cancelling it would leave a commit on the default branch
# with no verdict at all.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
      # The critical path of the whole workflow is compilation, not testing.
      # Measured on run 30768667155: vet 54s, lint 51s, test-race 62s — 167 of
      # this job's 206 seconds, and all three were compiling the same four
      # modules from scratch because nothing here preserved a build cache. The
      # tests themselves take seconds, as `mise run test` locally shows.
      #
      # Keyed on the go.sum files, so a dependency change invalidates it and
      # anything else reuses it; the restore-keys line means a change to one
      # module still starts from the previous run's cache rather than empty.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-gate-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-gate-${{ runner.os }}-
      # Individually rather than via `mise run ci`, so a failure names the gate
      # that failed in the job summary instead of one opaque step.
      # No fmt-check step: formatting is reported by the gofmt formatter inside
      # `lint`, which sees strictly more than a tracked-files check could
      # (docs/architecture.md, "Tooling scoped to tracked files").
      - run: mise run vet
      - run: mise run lint
      - run: mise run tidy-check
      - run: mise run deps-check
      - run: mise run generate-check
      - run: mise run impact-check
      - run: mise run eject-check
      # git and tr over four tracked files, no Go and no cache. The tagline is
      # the first sentence anyone reads about this project and it is written
      # out by hand in four places that nothing links, so the copy the README
      # stops making is one the site keeps making.
      - run: mise run tagline-check
      # The same shape, over the column vocabulary. docs/schema/README.md names
      # the constructors in prose and points at the reference page for the
      # table, so that page is now the only enumeration and nothing else would
      # notice it falling behind schema/field.go.
      - run: mise run column-check
      - run: mise run lint-check
      - run: mise run map-check
      # And the same shape again, over the decision citations. The Decisions
      # section of docs/architecture.md carries no numbers, so a number that
      # names two decisions -- as 0059 did, from two branches at once --
      # contradicts no file and breaks no link for anything else to catch.
      - run: mise run adr-check
      - run: mise run test-race
      - run: mise run test-auth-workos
      - run: mise run test-attachments
      # Node comes from mise.toml, like Go and golangci-lint. This is the gate
      # docs/architecture.md's "Typescript client" decision promised the
      # TypeScript client would need: the emitted client's guarantees are
      # enforced by tsc, so an unchecked one guarantees nothing.
      - run: mise run test-ts
      # And the third toolchain, for the same reason: the Dart client's
      # guarantees are enforced by `dart analyze`, so an unchecked one
      # guarantees nothing. The Dart SDK alone — the emitted client imports
      # nothing, so no Flutter is installed here (docs/architecture.md, "Dart client").
      - run: mise run test-dart
      # In this job rather than the postgres one because the generated CLI
      # speaks HTTP: its tests drive the command tree against an httptest
      # server, so what they check — that the flags reach the wire as the
      # filter grammar — needs no database at all.
      - run: mise run test-cli

  postgres:
    # A job of its own rather than a step in `gate`, so that "the SQL is not
    # valid against a real Postgres" is distinguishable at a glance from "the
    # engine's unit tests fail" — they have completely different causes.
    runs-on: ubuntu-latest

    # The same three servers compose.yaml starts locally, on the same host
    # ports, so mise.toml's [env] defaults are correct here with nothing to
    # override. The suites read SQLB_TEST_* and start nothing themselves.
    #
    # Service containers rather than testcontainers: they come up in parallel
    # with checkout and mise setup instead of inside the test binary, there is
    # no reaper, and pgtest's go.mod drops from about fifty modules to six —
    # which is the reason that module exists at all. See pgtest/doc.go.
    #
    # No `command:` here, so max_connections is the stock 100. That is what the
    # -parallel 8 cap in mise.toml's test-pg is sized against: eight concurrent
    # tests holding a pool of eight is 64.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sqlb
          POSTGRES_PASSWORD: sqlb
          POSTGRES_DB: sqlb
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U sqlb"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
      pgvector:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: sqlb
          POSTGRES_PASSWORD: sqlb
          POSTGRES_DB: sqlb
        ports: ["15433:5432"]
        options: >-
          --health-cmd "pg_isready -U sqlb"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
      pgbouncer:
        image: edoburu/pgbouncer:v1.24.1-p1
        env:
          # By service name: GitHub puts a job's service containers on one
          # network, so the pooler reaches Postgres the same way compose.yaml
          # wires it. This is the piece the old harness could only do by
          # reading one container's IP to configure another.
          DB_HOST: postgres
          DB_PORT: "5432"
          DB_USER: sqlb
          DB_PASSWORD: sqlb
          DB_NAME: "*"
          POOL_MODE: transaction
          AUTH_TYPE: scram-sha-256
          ADMIN_USERS: sqlb
          MAX_DB_CONNECTIONS: "2"
          DEFAULT_POOL_SIZE: "2"
        ports: ["16432:5432"]

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
      # A cache of its own rather than the gate's: this job builds the pgtest
      # module and the two examples, which the gate never compiles, so sharing
      # one key would have each job evicting the other's entries.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-postgres-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-postgres-${{ runner.os }}-
      # Postgres and pgvector are gated by their own health checks, which hold
      # the job until they answer. PgBouncer has none — the image ships neither
      # pg_isready nor a shell health probe worth trusting — so it is waited for
      # here rather than left to be the flake that only appears under load.
      - name: wait for pgbouncer
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/16432) 2>/dev/null; then
              echo "pgbouncer is listening"; exit 0
            fi
            sleep 1
          done
          echo "pgbouncer never came up on 16432"; exit 1
      - run: mise run test-pg
      - run: mise run test-demo
      # The fx example boots the whole application against Postgres, including
      # the composition that must refuse to start. Its one database-free test
      # runs here too rather than in `gate`, because splitting a module's suite
      # across two jobs costs more attention than it saves.
      - run: mise run test-fx
