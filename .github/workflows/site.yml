# Builds the documentation site, and deploys it to GitHub Pages from `main`.
#
# The deploy was removed while the repository was private: Pages cannot serve a
# private repository on this plan, so `deploy-pages` answered 404 with "Ensure
# GitHub Pages has been enabled" and made every push to `main` red for a reason
# that had nothing to do with the commit. The repository is public now, so the
# deploy works and is back.
#
# The build is kept separate from any Go CI on purpose: the site is Astro, so
# folding it into a Go gate would make Node a build dependency of a library
# whose whole point is that it imposes none. A red site build should not be able
# to say the library is broken.
#
# The build is also the check. `npm run build` runs the link check, so a docs
# edit whose link resolves to nothing fails here — which is the half that ever
# caught anything, and the reason this still runs on pull requests where there
# is nothing to publish.
name: site

on:
  push:
    branches: [main]
    # The site is generated from docs/, so an edit there has to rebuild it.
    #
    # Deliberately the whole directory rather than the published subset. This
    # filter listed docs/guide/** when the guide was the only source, and adding
    # docs/adr/ and docs/ silently outgrew it: ADR-0022 was committed, CI was
    # green, and the page 404d because no build ran. A filter that has to be
    # widened every time SOURCES grows is a filter that will be wrong again.
    # Building on an unpublished docs/ change is cheap; not building on a
    # published one is invisible.
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site.yml"
  # On pull requests too: a deploy belongs on `main` and a check belongs where
  # the change is. This closes the trap CLAUDE.md carried for two releases —
  # that `gh pr checks` showed one of the two workflows, so a docs break was
  # invisible until after the merge. Keeping the push trigger as well is not
  # redundant: two pull requests can be green on their own base and red as a
  # pair, and only the merge sees that.
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One build per ref. A superseded pull-request build is cancelled — nothing is
# published from one, so there is no half-written state to protect. A `main`
# build is not, because it deploys: a cancelled deploy can leave the site
# serving a half-published build.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      # ci rather than install: the lockfile is committed, so the runner builds
      # what was resolved locally instead of re-resolving.
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    # Only from `main`. A pull request builds — that is the link check — but has
    # nothing to publish, and publishing from one would serve an unmerged branch
    # to everybody.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
