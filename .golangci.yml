# Pinned to golangci-lint 2.x (see mise.toml for why the version is pinned).
version: "2"

linters:
  enable:
    - errcheck      # an unchecked error is the usual cause of a silent failure
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint     # %w and errors.Is/As used correctly
    - copyloopvar
    - makezero
    - nilerr
    - unconvert
    - misspell

  settings:
    staticcheck:
      # golangci-lint's own default disables the doc-comment checks
      # (ST1000/ST1020/ST1021/ST1022) that staticcheck ships enabled. Turning
      # them back on is what makes `go doc` a trustworthy map of the exported
      # surface — every exported symbol's comment starts with its name, and
      # every package has one — which matters here because the API reference
      # *is* the Go doc comments (CLAUDE.md). ST1003 (naming) and ST1016
      # (receiver-name consistency) stay off: they are style opinions
      # unrelated to doc coverage, not what this is for.
      checks:
        - all
        - -ST1003
        - -ST1016
    errcheck:
      # A bad type assertion panics with a message that says nothing about
      # which invariant broke, so require the comma-ok form.
      check-type-assertions: true
      # `_ =` is the idiom for "considered and deliberately ignored"; flagging
      # it removes the only way to say that.
      check-blank: false
      exclude-functions:
        # Redundant with rows.Err(), which every read path already checks.
        - (*database/sql.Rows).Close

  exclusions:
    rules:
      # Test helpers legitimately ignore errors from the fake driver.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  # Load-bearing: this is the *only* formatting gate in the build. There was a
  # separate `fmt-check` mise task and it was removed as redundant with this
  # (ADR-0018), so disabling this line does not fall back to anything — it
  # leaves formatting unchecked. Proven to fail on a formatting-only defect
  # rather than assumed to, per ADR-0016.
  enable:
    - gofmt
