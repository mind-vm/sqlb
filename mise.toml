# sqlb tasks and pinned toolchain.
#
#   mise tasks          list what is here
#   mise run ci         the full gate, same as .github/workflows/ci.yml
#   mise run test       the inner loop
#
# Tool versions are pinned so every checkout and CI runner builds and lints with
# the same toolchain.
[tools]
# Matches the application repository sqlb is developed against, so it is built
# with the toolchain it will be consumed by. go.mod deliberately declares a
# *lower* minimum (1.25): a library should not force its consumers onto a newer
# toolchain than it needs.
go = "1.26.4"
# Pinned for the same reason as there: a newer golangci-lint can add or
# redefine analyzers and turn a green tree red, or quietly stop reporting a real
# finding. Bump deliberately, then run `mise run lint`.
golangci-lint = "2.12.2"
# Node is here for one thing: typechecking the TypeScript client codegen emits
# into example/tasks/web. That is the cost the "Typescript client" decision in
# docs/architecture.md names — a second toolchain
# in a repository whose Go module takes one dependency — and it is paid here
# rather than in the Go module, which still inherits nothing else. Pinned for the
# same reason the others are: the emitted client's guarantees are enforced by
# tsc, and a different tsc is a different guarantee.
node = "26.4.0"
# The third toolchain, and the last one this repository intends to acquire. It
# is here for the Dart client codegen emits into example/tasks/mobile, whose
# guarantees are enforced by `dart analyze` the way the TypeScript client's are
# by tsc — including the `unnecessary_ignore` lint that makes lib/refusals.dart
# a gate rather than a comment (docs/architecture.md, "Dart client"). The Dart SDK alone, not Flutter: the
# emitted client imports nothing, so nothing in that package needs a Flutter
# toolchain and CI does not pay for one.
dart = "3.12.2"

# ---- Tasks ----

[tasks.test]
description = "Run all tests. No Docker and no Postgres needed: the engine's tests run against an in-memory Executor, so hooks, scanning and the mutation paths are covered without a live database."
run = "go test ./..."

[tasks.test-race]
description = "Run all tests with the race detector. Worth running before touching anything that caches per-type state — the model cache, the hook registry, or Describe, which publishes a fresh copy of a cached model rather than writing the one already handed out. concurrency_test.go and rest/concurrency_test.go are the tests that make this gate mean something: nothing else in the suite runs two requests at once."
run = "go test -race ./..."

# ---- The test databases ----
#
# The suites take a DSN and start nothing. compose.yaml provides the servers
# locally; .github/workflows/ci.yml provides the same three as service
# containers, on the ports the runner maps. These defaults match compose.yaml,
# and CI overrides them.
[env]
SQLB_TEST_POSTGRES = "postgres://sqlb:sqlb@localhost:15432/postgres?sslmode=disable"
SQLB_TEST_PGVECTOR = "postgres://sqlb:sqlb@localhost:15433/postgres?sslmode=disable"
SQLB_TEST_PGBOUNCER = "postgres://sqlb:sqlb@localhost:16432/postgres?sslmode=disable"

[tasks.pg-up]
# bash explicitly, because the probe below uses /dev/tcp, which is a bash
# feature and not POSIX. mise runs task scripts under `sh`, and on macOS that
# is bash in posix mode — where /dev/tcp works — while on Ubuntu it is dash,
# where it does not. The first version of this task omitted this line, passed
# every local run, and failed in CI by falling through the probe and trying to
# bind ports the service containers already held.
shell = "bash -c"
description = "Make sure the Postgres, pgvector and PgBouncer the database-backed suites run against are listening. Starts compose.yaml if they are not; does nothing if they are. `mise run pg-down` stops them."
run = '''
# A probe before a start, which is what makes this safe to hang off every
# database-backed task with `depends`. Two callers need that:
#
#   - the inner loop, where `mise run test-pg` twice in a row should cost one
#     docker call rather than two;
#   - CI, where the servers are service containers on these same ports and
#     `docker compose up` would try to bind ports already taken and fail the
#     job. Probing first means the workflow needs no special case, and no
#     CI-only guard that could drift out of step with reality.
listening() {
  (echo > "/dev/tcp/127.0.0.1/$1") 2>/dev/null
}

if listening 15432 && listening 15433 && listening 16432; then
  echo "pg-up: already listening on 15432, 15433, 16432"
  exit 0
fi

# Anything already holding one of the three, without holding all three, is a
# situation compose cannot resolve and should not paper over — a half-started
# stack, or a service container plus a missing one. Say which, rather than
# letting docker report a port collision several lines later.
for port in 15432 15433 16432; do
  if listening "$port"; then
    echo "pg-up: $port is in use but the other servers are not up." >&2
    echo "       Something else is holding it; run 'mise run pg-down' or free it." >&2
    exit 1
  fi
done

docker compose up -d --wait

# PgBouncer has no health check of its own — the image ships nothing worth
# trusting as one — so --wait returns before it is necessarily accepting
# connections. Waited for here rather than left as the flake that shows up
# only on a loaded machine.
for _ in $(seq 1 60); do
  listening 16432 && break
  sleep 1
done
if ! listening 16432; then
  echo "pg-up: pgbouncer never came up on 16432" >&2
  exit 1
fi

echo "pg-up: ready. the suites find them via SQLB_TEST_* - see [env] above"
'''

[tasks.pg-down]
description = "Stop the test databases and discard their data. Nothing is persisted, so this loses only what a test left behind."
run = "docker compose down -v --remove-orphans"

[tasks.test-pg]
description = "Run the round-trip and connection-path tests against a real Postgres and a real PgBouncer. Starts them first via pg-up. Deliberately NOT part of `test`: the engine's suite is database-free and that is worth keeping as the inner loop. This is what answers whether the generated SQL is *valid* rather than merely *expected* — see pgtest/doc.go."
dir = "pgtest"
depends = ["pg-up"]
# -parallel 8 rather than the default, which is the core count. The suite runs
# in parallel and each test's pool caps at 8, so the connection ceiling is the
# product of the two: 64, which fits a stock server's 100 with room. Left to
# default it would scale with whatever machine it runs on and eventually walk
# into max_connections on somebody's laptop and nowhere else.
run = "go test -parallel 8 ./..."

[tasks.bench-pg]
depends = ["pg-up"]
description = "Measure what sqlb costs over pgx, against a real Postgres. Deliberately NOT part of `ci`: benchmark numbers from a shared runner are noise, and a gate that fails on them trains people to ignore it. It exists because docs/architecture.md's \"The driver is a dependency\" decision argued partly on performance, and its \"Pgbouncer in the path\" decision is the precedent for what happens when a decision in this repo reasons from documentation instead of measuring — two of its three claims came back different. Now that the flip has landed, both arms run on pgx and what is left is the builder and the reflective scan."
dir = "pgtest"
run = "go test -run '^$' -bench . -benchmem ./..."

[tasks.test-demo]
depends = ["pg-up"]
description = "Run the task-manager example's suite against a real Postgres. Starts it first via pg-up. Separate from `test` for the same reason `test-pg` is: the engine's inner loop stays database-free. This is the example that proves the pieces compose — schema to migration to DDL Postgres accepts, a JWT workspace boundary that holds across tenants, and a transaction that leaves nothing behind when it aborts. It also carries the drift gate `generate-check` cannot be: migrations/drift_test.go replays the checked-in history and requires it to build what taskschema declares, so editing schema.go without adding a migration fails here rather than in production."
dir = "example/tasks"
run = "go test ./..."

[tasks.test-fx]
depends = ["pg-up"]
description = "Run the fx example, including the fxkit glue it assembles itself from. The kit's own tests need no database — graph validation constructs nothing, and the rest exercise the assembly seams directly. The example needs a database for all but one of its tests: everything else boots the whole application against a real Postgres because the claims are about a boot — that the migrations apply, that provisioning survives a restart, that the space boundary holds between two callers. It also carries the one assertion the other examples cannot make: with the notes module removed from the list, the server must refuse to start rather than serve unscoped rows (docs/architecture.md, \"Declared scope is required\")."
run = '''
set -e
cd "$MISE_PROJECT_ROOT/example/fxapp" && go test ./...
'''

[tasks.test-auth-workos]
description = "Run the WorkOS adapter's suite. Database-free, unlike test-demo/test-fx: the adapter verifies JWTs against an in-memory or httptest-served JWKS, never a live WorkOS endpoint or a database, so this needs no pg-up."
run = '''
cd "$MISE_PROJECT_ROOT/example/auth-workos" && go test ./...
'''

[tasks.test-attachments]
description = "Run the presigned-upload example's suite. Database-free and bucket-free, like test-auth-workos: the flow runs against sqlbtest's scripted Executor and an httptest endpoint holding objects in a map, so what it gates is the ordering — a row before the bytes, an object removed only after the commit — rather than anything a container would answer. The signature is gated against aws-sdk-go-v2's, pinned as a golden. The suite that needs real storage skips unless SQLB_TEST_S3_ENDPOINT names one; example/attachments/README.md has the RustFS and MinIO invocations."
run = '''
cd "$MISE_PROJECT_ROOT/example/attachments" && go test ./...
'''

[tasks.test-ts]
description = "Typecheck the generated TypeScript client and run its encoder tests. The typecheck is the test: the client's whole claim is that a misspelled column, an operator its column type does not accept, or a sort on a column that did not opt in fails at tsc. example/tasks/web/src/refusals.ts asserts each of those with @ts-expect-error, so a generator that widened a type would fail here."
dir = "example/tasks/web"
run = '''
[ -d node_modules ] || npm ci --no-audit --no-fund
npm run typecheck
npm test
'''

[tasks.test-dart]
description = "Analyse the generated Dart client, check its formatting, and run its tests. Three gates in one, and each earns its place: `dart analyze --fatal-infos` is where the client's claim lives — a misspelled column, an operator its type does not accept, a sort on a column that did not opt in, and lib/refusals.dart marks each of those with an `// ignore:` that the unnecessary_ignore lint reports if it ever stops being needed. `dart format` must be a no-op, because the emitter reproduces its decisions rather than deferring to it, and a generated file the formatter would rewrite puts a project's format gate and its staleness gate in conflict."
dir = "example/tasks/mobile"
run = '''
dart pub get
dart analyze --fatal-infos
dart format --output=none --set-exit-if-changed .
dart test
'''

[tasks.test-cli]
description = "Build the generated command-line client and run its round-trip tests. No Docker: the CLI speaks HTTP, so its tests drive the emitted command tree against an httptest server and assert what reaches the wire — that the flags compose into the filter grammar, that --all walks by cursor, and that a rejection still names what would have been accepted. Separate from `test-demo`, whose other packages need a database, so this stays in the fast half of the gate."
dir = "example/tasks"
run = '''
# Built to nowhere: the gate is that the emitted package compiles, and leaving
# a binary behind in a checked-out tree would be one more thing .gitignore has
# to know about.
go build -o /dev/null ./cmd/taskctl
go test ./cli/...
'''

[tasks.test-studio]
description = "Build the uncurated data/schema/action browser (docs/architecture.md, \"The manifest describes what cannot be guessed\") and run its tests. No Docker and no Postgres: it speaks REST, so its tests drive the routes against an httptest fake standing in for a generated API, the same way test-cli's does for the CLI. Not part of `ci` yet — see the module's README for what full CI wiring would still need to decide (the layout doc's 'four modules' claim, mainly)."
dir = "studio"
run = '''
go build -o /dev/null ./cmd/sqlb-studio
go test ./...
'''

[tasks.demo-migrate]
description = "Regenerate the task-manager example's migrations from its schema. Rewrites the checked-in files, which is safe only because they are a baseline nobody has applied to a database that matters."
dir = "example/tasks"
run = "go run ./cmd/migrate -force"

[tasks.cover]
description = "Run tests with coverage and print the per-function summary. Writes coverage.out, which is gitignored."
run = '''
go test -coverprofile=coverage.out ./...
go tool cover -func=coverage.out | tail -20
'''

[tasks.vet]
description = "go vet across all five modules"
run = '''
set -e
go vet ./...
cd "$MISE_PROJECT_ROOT/pgtest" && go vet ./...
cd "$MISE_PROJECT_ROOT/example/tasks" && go vet ./...
cd "$MISE_PROJECT_ROOT/example/fxapp" && go vet ./...
cd "$MISE_PROJECT_ROOT/example/auth-workos" && go vet ./...
cd "$MISE_PROJECT_ROOT/example/attachments" && go vet ./...
'''

[tasks.lint]
description = "golangci-lint across all five modules. Formatting is reported here rather than by a gate of its own — docs/architecture.md, \"Tooling scoped to tracked files\"."
run = '''
set -e
golangci-lint run
cd "$MISE_PROJECT_ROOT/pgtest" && golangci-lint run
cd "$MISE_PROJECT_ROOT/example/tasks" && golangci-lint run
cd "$MISE_PROJECT_ROOT/example/fxapp" && golangci-lint run
cd "$MISE_PROJECT_ROOT/example/auth-workos" && golangci-lint run
cd "$MISE_PROJECT_ROOT/example/attachments" && golangci-lint run
'''

[tasks.lint-fix]
description = "golangci-lint --fix (applies autofixes; review the diff)"
run = "golangci-lint run --fix"

[tasks.fmt]
description = "gofmt -w across the files git tracks. `mise run lint` is what reports bad formatting; this is the fix for it."
run = '''
# There is deliberately no fmt-check gate. golangci-lint has the gofmt formatter
# enabled and fails on a formatting-only defect, and what it sees is a strict
# superset of the tracked Go files, so a separate check gated nothing that lint
# did not already gate. docs/architecture.md's "Tooling scoped to tracked
# files" decision records the reasoning and what would bring it back.
#
# Still scoped to the files git tracks rather than `gofmt -w .`: the unscoped
# walk descends into .claude/worktrees/, which .git/info/exclude ignores and
# which holds unrelated parallel checkouts. This task *rewrites* what it walks,
# so that version reformatted another session's checkout underneath whoever was
# working in it.
files=$(git ls-files '*.go')
if [ -z "$files" ]; then
  echo "fmt: no tracked Go files"; exit 1
fi
printf '%s\n' "$files" | xargs gofmt -w
'''

[tasks.heal]
description = "Apply every fix the tooling can make on its own — formatting, lint autofixes, go.mod tidying, regenerated code — then report what changed. Run this before `ci`, which gates and never rewrites."
run = '''
set -e
# Healing and gating are deliberately separate tasks. A gate that rewrote the
# tree and then reported green would certify code that was never clean, and on
# a CI runner the rewrite is discarded anyway — the failure mode
# docs/architecture.md's "Guards proven both ways" decision is about. So `ci`
# reports and this fixes; nothing does both.
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT

# Snapshot content hashes first, so the report names what *this run* changed
# rather than everything that differs from HEAD. `git diff` cannot answer that
# question — it compares against the last commit, not against the tree as it
# stood a moment ago, so on a dirty tree it would credit heal with every edit
# the author had already made. The first version of this task did exactly that
# and reported "nothing to fix" while having just reformatted a file.
git ls-files > "$tmp/names"
if ! git hash-object --stdin-paths < "$tmp/names" > "$tmp/before" 2>"$tmp/err"; then
  echo "heal: could not read the tree, so nothing was run:"; sed 's/^/  /' "$tmp/err"; exit 1
fi

mise run fmt
# The example's hand-written Dart, for the same reason gofmt runs above: the
# gate checks formatting and this is where it gets fixed. The generated client
# is format-stable by construction (docs/architecture.md, "Dart client"), so this only ever touches files
# a person wrote.
(cd "$MISE_PROJECT_ROOT/example/tasks/mobile" && dart format . > /dev/null)
# lint-fix exits non-zero when findings remain that it cannot fix by itself.
# That is not a failure of healing, and must not abort the report below.
mise run lint-fix || remaining=1
mise run tidy
mise run generate

if ! git hash-object --stdin-paths < "$tmp/names" > "$tmp/after" 2>"$tmp/err"; then
  echo "heal: the fixers ran but the result could not be compared:"; sed 's/^/  /' "$tmp/err"; exit 1
fi

echo
healed=$(paste -d' ' "$tmp/before" "$tmp/after" "$tmp/names" | awk '$1 != $2 { print "  " $3 }')
if [ -n "$healed" ]; then
  echo "healed:"; echo "$healed"
else
  echo "heal: nothing to fix"
fi
if [ -n "${remaining:-}" ]; then
  echo
  echo "lint still reports findings it cannot fix on its own; run: mise run lint"
fi
exit 0
'''

[tasks.preflight]
description = "What to run before pushing. NOT the gate — `ci` is, and it runs on GitHub. This heals what the tooling can fix on its own, then proves the tree compiles and its database-free tests pass. Seconds, no Docker, no race detector, no Node, no Dart."
run = '''
set -e
# The gate moved to CI deliberately. `mise run ci` on a laptop is the same
# fourteen stages GitHub already runs in three parallel jobs, and running it
# locally buys nothing but a slower loop — measured at 90s warm on an idle
# machine, seven containers of its own, and considerably worse when several
# worktrees do it at once. What is left here is only the part whose answer is
# worth having *before* a push rather than three minutes after it.
#
# `heal` first, because the most common way this repository turns CI red is
# drift a fixer would have silenced: unformatted code, a lint finding with an
# autofix, an untidied go.mod, generated output that no longer matches its
# source. Each of those costs a full CI round-trip to learn and one second to
# fix, so it is fixed here.
mise run heal

# Then the two questions worth a local answer: does it build, and do the tests
# that need nothing but Go still pass. Every module, because `heal` regenerates
# code the examples compile against and a break there is invisible from the root.
echo
for mod in . pgtest example/tasks example/fxapp example/auth-workos example/attachments; do
  (cd "$MISE_PROJECT_ROOT/$mod" && go build ./...)
done
go test ./...

echo
echo "preflight: ok — CI is the gate, and it runs on the PR"
'''

[tasks.tidy]
description = "go mod tidy"
run = "go mod tidy"

[tasks.tidy-check]
description = "Fail if go.mod or go.sum would change, in any module. Catches a dependency added but not tidied."
run = '''
# Every module, because pgtest and the two examples have a go.mod each and an
# untidied one there fails in CI exactly as confusingly as an untidied one here.
status=0
for mod in . pgtest example/tasks example/fxapp example/auth-workos example/attachments; do
  cd "$MISE_PROJECT_ROOT/$mod"
  cp go.mod go.mod.bak
  [ -f go.sum ] && cp go.sum go.sum.bak
  go mod tidy
  diff -q go.mod go.mod.bak >/dev/null || { echo "$mod/go.mod is not tidy; run: mise run tidy"; status=1; }
  mv go.mod.bak go.mod
  [ -f go.sum.bak ] && mv go.sum.bak go.sum
done
exit $status
'''

[tasks.deps-check]
description = "Fail if a dependency the engine has not chosen has crept in. The engine depends on pgx and nothing else (docs/architecture.md, \"The driver is a dependency\"); `rest` additionally on huma; anything more is a regression. Every dependency sqlb takes is one its consumers inherit, so the list is short and it is checked rather than remembered."
run = '''
# What must hold: the engine's dependency list is a decision docs/architecture.md
# argues for, and this is where the decision is checked rather than remembered. "Zero
# dependencies" stopped being the invariant when sqlb took pgx — but "pgx, and
# nothing that arrived without an argument" is a stronger claim than the old one
# was, because the old one was never written down in a record at all.
#
# docs/architecture.md's "Guards proven both ways" decision: a guard must be
# proven in both directions, so this one ends by
# checking that it *does* fire for `rest`. Three earlier guards in this repo
# reported success while verifying nothing.

# rest is an adapter onto huma, and the generated examples mount it. withsqlc
# is on this list only because its stage 4 does — the point that example makes
# is that taking the REST layer is the step where a project accepts a web
# framework it did not choose, so the example that says so has to pay it too.
# Stages 1 through 3 of that package take nothing beyond pgx.
#
# outbox is here for a narrower reason and it is worth stating, because "it
# imports rest" is not on its own an argument — that is how every unwanted
# dependency arrives. It implements rest.Source and rest.TxPublisher over
# rest.Event, and there is no use of it that does not also mount rest.Events:
# an outbox feeding nothing is a table nobody reads. So it inherits huma from a
# package its own consumers already have, and adds nothing of its own. The day
# somebody wants the durable feed without the HTTP surface, the fix is to move
# the four event types to a leaf package and this entry comes back out — which
# is a real possibility and the reason this paragraph exists rather than a name
# quietly added to the list above.
huma_ok='github.com/jryannel/sqlb/rest github.com/jryannel/sqlb/outbox github.com/jryannel/sqlb/example/blog github.com/jryannel/sqlb/example/withsqlc github.com/jryannel/sqlb/example/evolve'

# third_party lists the non-stdlib, non-sqlb packages one package imports,
# transitively. A stdlib path has no dot in its first element, which is what
# distinguishes it from a module path — and is why an earlier version that
# grepped for "golang.org/x" matched the standard library's own vendored copies.
third_party() {
  go list -deps "$1" | grep -E '^[^/]+\.[^/]+/' | grep -v '^github.com/jryannel/sqlb' | sort -u
}

# The dependencies pgx brings with it, computed rather than listed. They are
# pgx's choices, not sqlb's, and refusing them would only mean refusing pgx by
# another name — but enumerating them by hand would go stale the first time pgx
# reorganised, and a stale allow-list is how a real regression gets waved
# through. So the set is whatever pgx itself pulls in, asked of the toolchain.
# The file is written rather than the list held in a variable because this task
# runs under sh, where process substitution is not available.
allowed=$(mktemp)
trap 'rm -f "$allowed" "$allowed.trim"' EXIT
go list -deps \
  github.com/jackc/pgx/v5 \
  github.com/jackc/pgx/v5/pgxpool \
  github.com/jackc/pgx/v5/stdlib \
  | grep -E '^[^/]+\.[^/]+/' | sort -u > "$allowed"
# Stripped of the whitespace wc pads with, which head will not accept.
pgx_only=$(wc -l < "$allowed" | tr -d ' ')

# unexpected filters a dependency list down to what nothing has argued for.
unexpected() {
  grep -Fxv -f "$allowed" || true
}

if ! pkgs=$(go list ./... 2>&1); then
  echo "deps-check: could not resolve packages, so nothing was verified:"
  printf '%s\n' "$pkgs" | sed 's/^/  /'
  exit 1
fi

checked=0
fail=0
for pkg in $pkgs; do
  checked=$((checked + 1))
  case " $huma_ok " in
    *" $pkg "*)
      # rest and the example that mounts it get huma, and only for the length
      # of this iteration.
      go list -deps github.com/danielgtaylor/huma/v2 \
        | grep -E '^[^/]+\.[^/]+/' >> "$allowed"
      # huma's own subpackages, which -deps on the root package does not
      # enumerate. Listing the module prefix is enough: what is being allowed
      # here is huma, and which of its files rest reaches is rest's business.
      third_party "$pkg" | grep '^github.com/danielgtaylor/huma/' >> "$allowed"
      ;;
  esac
  if deps=$(third_party "$pkg" | unexpected) && [ -n "$deps" ]; then
    echo "$pkg depends on something no record argues for:"
    printf '%s\n' "$deps" | sed 's/^/  /'
    fail=1
  fi
  # Back to pgx alone, so the next package does not inherit rest's allowance.
  head -n "$pgx_only" "$allowed" > "$allowed.trim" && mv "$allowed.trim" "$allowed"
done

if [ "$checked" -eq 0 ]; then
  echo "deps-check: no packages were checked, so nothing was verified"
  exit 1
fi
[ "$fail" -eq 0 ] || exit 1

# The positive controls. Each proves the check can still see a dependency at
# all; without them a silent pass means nothing.
if ! third_party github.com/jryannel/sqlb | grep -q '^github.com/jackc/pgx/v5'; then
  echo "deps-check: the check cannot see a dependency it should — the engine imports pgx but none was found"
  exit 1
fi
if ! third_party github.com/jryannel/sqlb/rest | grep -q '^github.com/danielgtaylor/huma'; then
  echo "deps-check: the check cannot see a dependency it should — rest imports huma but none was found"
  exit 1
fi
# And the direction that matters more: that the filter still *refuses*
# something. huma is allowed for two packages and the allow-list is back to pgx
# alone by now, so asking it about rest's dependencies here must report huma. If
# this stops firing, `unexpected` has stopped excluding anything and every pass
# above was vacuous.
if ! third_party github.com/jryannel/sqlb/rest | unexpected | grep -q '^github.com/danielgtaylor/huma'; then
  echo "deps-check: the filter accepted huma outside the two packages allowed it, so it is not filtering"
  exit 1
fi

# The hole the package-level check above cannot cover: `go list -deps` does not
# report test-only imports. A test file in this module importing a container
# runtime, an assertion library, or anything else convenient would leave every
# assertion above passing while go.mod grew — success reported by a check that
# had stopped covering anything, which is the failure mode docs/architecture.md's
# "Guards proven both ways" decision is about.
#
# So the root module's direct requirements are pinned by name. This is what
# keeps the pgtest module honest: moving those tests back in here fails loudly
# instead of silently.
#
# Read from both go.mod require forms: the block `require (\n\tpath ver\n)` and
# the single-line `require path ver` that `go mod tidy` collapses to when only
# one requirement remains. An earlier version grepped for indented lines only and
# read nothing the moment the block became a one-liner — a check that had stopped
# covering anything, the same failure mode the positive control below exists to
# catch.
want='github.com/danielgtaylor/huma/v2 github.com/jackc/pgx/v5'
got=$(awk '
  $1 == "require" && $2 != "(" && $0 !~ /\/\/ indirect/ { print $2; next }
  $1 == "require" && $2 == "(" { inblock = 1; next }
  inblock && $1 == ")" { inblock = 0; next }
  inblock && $0 !~ /\/\/ indirect/ && NF >= 2 { print $1 }
' go.mod | grep -E '\.[a-z]+/' | sort)

if [ "$got" != "$(printf '%s\n' $want | sort)" ]; then
  echo "deps-check: the root module's direct dependencies changed."
  echo "  want: $(printf '%s ' $want)"
  echo "  got:  $(printf '%s ' $got)"
  echo "A new one needs docs/architecture.md arguing for it, the way it argues for pgx."
  echo "Tests needing a container belong in the pgtest module, which has a go.mod"
  echo "of its own for exactly this reason. See pgtest/doc.go."
  exit 1
fi

# The positive control for the check just above, in the spirit of the others:
# prove it can read a direct requirement at all, rather than matching two empty
# strings and calling that agreement.
if [ -z "$got" ]; then
  echo "deps-check: read no direct requirements from go.mod, so the comparison above compared nothing"
  exit 1
fi

echo "deps-check: $checked packages, pgx and nothing unargued"
'''

[tasks.generate]
description = "Regenerate models, the typed column facade and the manifest from every schema package."
run = "go generate ./..."

[tasks.generate-check]
description = "Fail if committed generated code does not match what the schema would produce now. Generated code is committed, so it drifts: someone edits a schema, forgets to regenerate, and the models silently describe a table that no longer exists. Part of `ci`, in the same spirit as a sqlc-check gate."
run = '''
set -e
go run ./cmd/sqlb check ./example/blog/blogschema
# The schema-evolution example. Its generated code drifts like any other, and
# it is the one example where that is only half the story: what the migration
# history builds is checked in pgtest/evolve, which needs a database and so
# cannot be here.
go run ./cmd/sqlb check ./example/evolve/evolveschema
# The one schema package under internal/. It exists because the driver is
# compiled inside the module now; a regression putting it back outside would
# make this command unable to read such a package at all, since Go refuses the
# import. cmd/sqlb's test covers that mechanism — this keeps the output current.
go run ./cmd/sqlb check ./internal/internalschema
# The sqlc example reads a schema.sql rendered from the same declaration. If it
# drifts, sqlc is typing its queries against a schema the database no longer
# has, which is the exact failure docs/with-sqlc.md claims this arrangement
# prevents. Checked here; regenerating the sqlc output itself is not, because
# that would make sqlc a build dependency of a library whose whole point is not
# to impose its dependencies on consumers.
#
# This one keeps a generator of its own because it emits something codegen does
# not: plain DDL for sqlc to read. `sqlb generate` runs the emitters a Project
# declares, and a bespoke fourth artefact is exactly the case docs/architecture.md's
# "Sqlb command" decision says stays a hand-written main.
go run ./example/withsqlc/gen -check
# example/tasks is a module of its own, so its schema cannot be reached from the
# root module's package list and needs a line here. Forgetting it would leave
# the larger example's committed output free to drift, which is the exact
# failure this gate exists to catch.
cd "$MISE_PROJECT_ROOT/example/tasks" && go run github.com/jryannel/sqlb/cmd/sqlb check ./taskschema
# example/fxapp, likewise its own module. Its generated package also holds one
# hand-written file (store/module.go), which the check ignores: it compares the
# artefacts the emitters own and says nothing about their neighbours.
cd "$MISE_PROJECT_ROOT/example/fxapp" && go run github.com/jryannel/sqlb/cmd/sqlb check ./noteschema
'''

[tasks.impact-check]
description = "Fail if a schema edit has changed the generated REST contract in a way that breaks a deployed client — a renamed or un-exposed column, a dropped operation, a narrowed type (docs/architecture.md, \"A schema edit is an api edit\"). Diffs each example's schema against its committed restcontract.json baseline. Distinct from generate-check: that catches drift in the code sqlb writes, this catches drift in the API that code serves, and the two can disagree — a clean RENAME migration is a wire break. Re-record a baseline with `sqlb impact -write` when the change is intended. -error, not a bare run, because in a gate the point is to fail."
run = '''
set -e
go run ./cmd/sqlb impact -error ./example/blog/blogschema
# example/evolve is the example this gate exists for: its history contains a
# rename that is a clean migration and a broken client at once. The committed
# baseline is the post-rename contract, so this passes — what it protects is
# the *next* edit. example/evolve/history_test.go is where the rename is shown
# breaking something, by diffing against the contract as it stood before.
go run ./cmd/sqlb impact -error ./example/evolve/evolveschema
# example/tasks is its own module, so like generate-check it needs a line of its
# own; the root module's package list cannot reach its schema.
cd "$MISE_PROJECT_ROOT/example/tasks" && go run github.com/jryannel/sqlb/cmd/sqlb impact -error ./taskschema
cd "$MISE_PROJECT_ROOT/example/fxapp" && go run github.com/jryannel/sqlb/cmd/sqlb impact -error ./noteschema
'''

[tasks.eject-check]
description = "Fail if the committed ejected package no longer matches what the schema would produce now. `sqlb eject` writes the way out — the schema as SQL and the resources as plain net/http handlers over pgx — and an exit nobody checks is one that has quietly stopped working by the time it is needed (docs/architecture.md, \"The exit is generated\"). Only example/blog commits one, because one worked exit is the claim; the other examples would add gate time and say nothing new. Distinct from generate-check on purpose: generated code is stale when it disagrees with the schema, while an ejected package is *meant* to be edited, so the day a project takes the exit is the day it deletes this gate rather than fixing it."
run = "go run ./cmd/sqlb eject -check ./example/blog/blogschema"

[tasks.tagline-check]
description = "Fail if the four hand-written copies of the project's one-line pitch have drifted apart. README.md, docs/start/README.md and the site's two `description` fields all state what sqlb is, none of them is generated from any other, and nothing links them — so an edit to the README leaves three copies saying something the project stopped claiming. This is the same class as the mirroring CLAUDE.md already warns about for the emitter docs, caught the same way generate-check catches code that has drifted from the schema: cheaply, and before a reader does. It checks the claim rather than the wording, because the four are written for different media — a markdown paragraph, a YAML folded block, a JS string in three pieces — and forcing them to be byte-identical would be a gate that fights the copy instead of protecting it."
run = '''
set -e

# tr on macOS refuses a byte it cannot decode in a UTF-8 locale, and these files
# carry em dashes. C makes the lowercasing a byte operation, which is all it
# needs to be: it maps ASCII A-Z and leaves every multibyte sequence alone.
LC_ALL=C
export LC_ALL

# docs/architecture.md's "Tooling scoped to tracked files" decision: the files
# git tracks, not whatever is on disk. .claude/worktrees/ holds other checkouts
# of this same repository, and an unscoped read would happily validate another
# session's copy and report on that.
files="README.md docs/start/README.md site/src/content/docs/index.mdx site/astro.config.mjs"

# The claim every copy has to make: the lede, then the surfaces the one
# declaration is the source for. Lowercased, because docs/start reaches the
# phrase mid-sentence -- "sqlb is declarative Postgres for Go" -- where the
# other three open with it.
lede="declarative postgres for go"
terms="migrations models queries rest openapi clients"

# How far past the lede a copy has to have made its case. Wide enough for the
# longest of the four, narrow enough that the word "clients" elsewhere on the
# page cannot stand in for one in the tagline.
window=400

status=0
checked=0
for f in $files; do
  if ! git ls-files --error-unmatch "$f" > /dev/null 2>&1; then
    echo "tagline-check: $f is not tracked, so there is nothing to check against" >&2
    exit 1
  fi

  # Flattened to one lowercase line. The four wrap differently and that is not a
  # difference in what they claim.
  flat=$(tr '\n' ' ' < "$f" | tr -s ' ' | tr 'A-Z' 'a-z')

  # The lede has to be the phrase itself, not the opening of a longer word:
  # "for go" and "for golang" differ by a word boundary, and a substring test
  # cannot tell them apart -- it reads the second as the first and passes a
  # copy that has drifted. Walk the occurrences rather than testing only the
  # first, because a near-miss earlier in the file must not hide a real claim
  # later in it. End of string counts as a boundary; the terms check below is
  # what then reports the copy that stops at the lede.
  rest=$flat
  near=""
  found=0
  drifted=""
  while :; do
    case "$rest" in
      *"$lede"*) ;;
      *) break ;;
    esac
    after=${rest#*"$lede"}
    next=${after%"${after#?}"}
    case "$next" in
      [a-z0-9])
        # Keep the first near-miss for the message: naming the word a copy
        # actually says is the difference between a gate that reports and one
        # that only refuses.
        if [ -z "$drifted" ]; then
          drifted=$lede$(printf '%s' "$after" | sed 's/^\([a-z0-9]*\).*/\1/')
        fi
        ;;
      *)
        found=1
        near=$(printf '%s' "$after" | cut -c "1-$window")
        break
        ;;
    esac
    rest=$after
  done

  if [ "$found" -eq 0 ]; then
    if [ -n "$drifted" ]; then
      echo "$f: says \"$drifted\", which is not \"$lede\"" >&2
    else
      echo "$f: does not say \"$lede\"" >&2
    fi
    status=1
    checked=$((checked + 1))
    continue
  fi

  for t in $terms; do
    case "$near" in
      *"$t"*) ;;
      *)
        echo "$f: says \"$lede\" but not \"$t\" within $window characters of it" >&2
        status=1
        ;;
    esac
  done

  checked=$((checked + 1))
done

# The list is a literal above, so this can only fire if someone empties it --
# which would otherwise make the gate pass by checking nothing, the one failure
# mode a green check cannot report.
if [ "$checked" -eq 0 ]; then
  echo "tagline-check: no copies were checked, so nothing was verified" >&2
  exit 1
fi

if [ "$status" -ne 0 ]; then
  echo >&2
  echo "tagline-check: the tagline is written out by hand in $checked places and they disagree." >&2
  echo "Every copy has to open with \"$lede\" and name what is derived from the" >&2
  echo "schema within $window characters: $terms." >&2
  exit 1
fi

echo "tagline-check: $checked copies of the tagline agree"
'''

[tasks.column-check]
description = "Fail if the column type reference and the schema DSL have drifted apart. The reference page is the single enumeration of the column vocabulary — docs/schema/README.md names the constructors in prose and points at that page rather than repeating the table, because for a while it did repeat it and the two copies disagreed: the guide had no Pattern operators column, and neither copy had `Vector` at all. Same class as tagline-check, and the same reason CLAUDE.md warns about the emitter docs mirroring `codegen.Options` by hand."
run = '''
set -e

source=schema/field.go
page=site/src/content/docs/reference/column-types.mdx

# docs/architecture.md's "Tooling scoped to tracked files" decision, and the
# same reason tagline-check says so: .claude/worktrees/ holds other checkouts of
# this repository, and an unscoped read would validate one of those instead.
for f in $source $page; do
  if ! git ls-files --error-unmatch "$f" > /dev/null 2>&1; then
    echo "column-check: $f is not tracked, so there is nothing to check against" >&2
    exit 1
  fi
done

# The three that carry a section of their own rather than a table row, because a
# row would say less about them than the section does: Ref and ExternalRef emit
# a relation as well as a column, and UUIDv7 is a UUID with a default. They
# still have to be on the page -- this exempts them from the table, not from the
# reference. An addition here is a decision, which is the point of naming them.
sectioned="Ref ExternalRef UUIDv7"

# What the DSL exports. A method cannot match: its line begins "func (f *Field)",
# so the character after "func " is not uppercase.
constructors=$(grep -E '^func [A-Z][A-Za-z0-9]*\(' "$source" \
  | grep '\*Field' \
  | sed 's/^func \([A-Za-z0-9]*\)(.*/\1/' \
  | sort -u)

# What the Constructors table claims. That table only: the rest of the page is
# prose about modifiers, groups and table-level methods, none of them
# constructors and all of them misses.
rows=$(awk '/^## Constructors$/ {t=1; next} t && /^## / {exit} t && /^\| `/ {print}' "$page" \
  | sed 's/^| `\([A-Za-z0-9]*\)(.*/\1/' \
  | sort -u)

status=0

# Forward. The table is the enumeration, so a constructor missing from it is the
# failure -- not merely one missing from the page. Checking the page instead was
# the first draft of this gate, and it passed with the Vector row deleted
# because a paragraph further down still said the word.
for c in $constructors; do
  case " $sectioned " in
    *" $c "*)
      # Boundary, not substring: "SmallInt(" would otherwise stand in for "Int(".
      if ! grep -qE "(^|[^A-Za-z0-9_])$c\(" "$page"; then
        echo "column-check: schema.$c has no section in $page and is exempt from the table" >&2
        status=1
      fi
      continue
      ;;
  esac
  found=0
  for r in $rows; do
    if [ "$r" = "$c" ]; then found=1; break; fi
  done
  if [ "$found" -eq 0 ]; then
    echo "column-check: schema.$c is exported by $source and has no row in the Constructors table" >&2
    status=1
  fi
done

# Reverse: every row names something that exists.
for r in $rows; do
  if ! grep -qE "^func $r\(" "$source"; then
    echo "column-check: $page has a row for $r(), which $source does not export" >&2
    status=1
  fi
done

if [ "$status" -ne 0 ]; then
  echo >&2
  echo "The reference page is the enumeration. docs/schema/README.md points at it" >&2
  echo "instead of repeating it, so a constructor missing there is missing everywhere." >&2
  exit 1
fi

echo "column-check: $(echo $constructors | wc -w | tr -d ' ') constructors, all reachable from the reference"
'''

[tasks.lint-check]
description = "Fail if the lint reference table and schema/lint.go have drifted apart. Same shape as column-check, and added for the same reason it was: the table had gone three rules stale — `computed-without-index`, `text-required-on-create` and `page-size-without-list` were all in the linter and in nothing a reader would find. #293's whole argument is that prose duplicating a check is the worst of both, because it is the copy that can be wrong; a rule nobody can look up is the same failure pointed the other way."
run = '''
set -e

source=schema/lint.go
page=site/src/content/docs/reference/capabilities.mdx

# docs/architecture.md's "Tooling scoped to tracked files" decision:
# .claude/worktrees/ holds other checkouts of this repository, and an unscoped
# read would validate one of those instead.
for f in $source $page; do
  if ! git ls-files --error-unmatch "$f" > /dev/null 2>&1; then
    echo "lint-check: $f is not tracked, so there is nothing to check against" >&2
    exit 1
  fi
done

# What Lint can emit. Every diagnostic is built with a `Rule: "name"` field, so
# the set is readable without running it -- which matters, because a rule that
# fires only on some schema shape would otherwise need a schema to enumerate.
rules=$(grep -oE 'Rule: "[a-z0-9-]+"' "$source" \
  | sed 's/Rule: "\(.*\)"/\1/' \
  | sort -u)

# What the table claims. That section only: the page also carries a Validate
# table, whose rows are refusals rather than diagnostics.
rows=$(awk '/^## What the linter warns about$/ {t=1; next} t && /^## / {exit} t && /^\| `/ {print}' "$page" \
  | sed 's/^| `\([a-z0-9-]*\)`.*/\1/' \
  | sort -u)

status=0

for r in $rules; do
  found=0
  for row in $rows; do
    if [ "$row" = "$r" ]; then found=1; break; fi
  done
  if [ "$found" -eq 0 ]; then
    echo "lint-check: $source emits $r and $page has no row for it" >&2
    status=1
  fi
done

for row in $rows; do
  if ! grep -q "Rule: \"$row\"" "$source"; then
    echo "lint-check: $page has a row for $row, which $source does not emit" >&2
    status=1
  fi
done

if [ "$status" -ne 0 ]; then
  echo >&2
  echo "The reference page is the enumeration of what Lint reports. A rule missing" >&2
  echo "there is a rule an adopter meets for the first time in its own output." >&2
  exit 1
fi

echo "lint-check: $(echo $rules | wc -w | tr -d ' ') rules, all reachable from the reference"
'''

[tasks.adr-check]
description = "Fail if an ADR number does not name exactly one decision. The Decisions section of docs/architecture.md carries no numbers -- the headings are the identifiers and the numbers survive only in the citations -- so a number meaning two things contradicts no file and breaks no link, and nothing but this notices. It has happened: ADR-0059 was claimed by both the auth seam and the fx wiring decision, from parallel branches each numbering against the pre-consolidation docs/adr/ directory. Checks both directions, because they catch different bugs: a number pointing at two anchors is the collision, and an anchor cited under two numbers is the mislabel -- example/tasks/README.md called the Go CLI decision ADR-0030, which linked correctly and read correctly and was wrong. Also refuses a citation whose anchor is no longer a heading. Deliberately not checked: a bare prose mention that names no anchor, of which ADR-0004 and ADR-0018 are the only ones left with no anchored citation anywhere to define them -- inventing a mapping for those would encode the guess this gate exists to catch."
run = '''
set -e

page=docs/architecture.md

# docs/architecture.md, "Tooling scoped to tracked files" — .claude/worktrees/
# holds other checkouts of this repository, and an unscoped walk would read a
# citation out of one of those and blame this tree for it.
if ! git ls-files --error-unmatch "$page" > /dev/null 2>&1; then
  echo "adr-check: $page is not tracked, so there is nothing to check against" >&2
  exit 1
fi

# The anchors the Decisions section defines. GitHub derives an anchor from a
# heading by lowercasing it, dropping punctuation and hyphenating the spaces;
# two headings carry a comma and that is the whole of the punctuation in play.
# Headings outside that section are not decisions and are not citable as one.
anchors=$(awk '/^## Decisions/ {d=1; next} d && /^## / {exit} d && /^### / {sub(/^### /, ""); print}' "$page" \
  | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9 -]//g; s/ /-/g' | sort -u)

# Every citation that names an anchor, as "number anchor file:line". Two forms
# carry one: the markdown link used across docs/, and the Go doc link
# definition used in package comments. A citation whose target has no "#" is
# pointing at a pre-consolidation docs/adr/ path and is left alone — those
# survive only in the dated artifacts under docs/superpowers/, which record
# what was planned at the time rather than where the decision lives now.
links=$(git ls-files -z | xargs -0 grep -IHnoE '\[ADR-[0-9]{4}\]\((\.\./)*(docs/)?architecture\.md#[a-z0-9-]+\)|\[ADR-[0-9]{4}\]\(#[a-z0-9-]+\)' 2>/dev/null \
  | sed -E 's%^([^:]+):([0-9]+):\[(ADR-[0-9]{4})\]\([^#]*#([a-z0-9-]+)\)$%\3 \4 \1:\2%' || true)

defs=$(git ls-files -z | xargs -0 grep -IHnoE '\[ADR-[0-9]{4}\]: [^ ]*architecture\.md#[a-z0-9-]+' 2>/dev/null \
  | sed -E 's%^([^:]+):([0-9]+):\[(ADR-[0-9]{4})\]: [^ ]*#([a-z0-9-]+)$%\3 \4 \1:\2%' || true)

cited=$(printf '%s\n%s\n' "$links" "$defs" | grep -v '^$' | sort -u)

# The distinct claims being made, independent of how many places make each one.
# Collapsing to pairs first is the whole check: a number cited fifty times is
# not a conflict; a number cited twice against two anchors is.
pairs=$(echo "$cited" | awk '{print $1, $2}' | sort -u)

status=0

# One number, one decision. This is the collision that folding the ADRs into
# architecture.md made invisible: the headings stopped carrying numbers, so a
# number meaning two things contradicted no file and broke no link.
for n in $(echo "$pairs" | awk '{print $1}' | uniq -d); do
  echo "adr-check: $n cites more than one decision --" >&2
  for a in $(echo "$pairs" | awk -v n="$n" '$1 == n {print $2}'); do
    echo "$cited" | awk -v n="$n" -v a="$a" '$1 == n && $2 == a {c++; if (c == 1) first = $3} END {printf "  %-46s %d citation%s, e.g. %s\n", a, c, (c == 1 ? "" : "s"), first}' >&2
  done
  status=1
done

# One decision, one number. The reverse, and not the same check: a citation can
# carry the right anchor under the wrong number, which links correctly, reads
# correctly, and is wrong. Nothing that follows links can see it.
for a in $(echo "$pairs" | awk '{print $2}' | sort | uniq -d); do
  echo "adr-check: the decision \"$a\" is cited under more than one number --" >&2
  for n in $(echo "$pairs" | awk -v a="$a" '$2 == a {print $1}' | sort); do
    echo "$cited" | awk -v n="$n" -v a="$a" '$1 == n && $2 == a {c++; if (c == 1) first = $3} END {printf "  %-10s %d citation%s, e.g. %s\n", n, c, (c == 1 ? "" : "s"), first}' >&2
  done
  status=1
done

# Every cited anchor is a heading that exists — a decision renamed without its
# citations following, which no link checker sees either, because docs/ is
# published to a site that resolves anchors client-side or not at all.
for a in $(echo "$pairs" | awk '{print $2}' | sort -u); do
  found=0
  for h in $anchors; do
    if [ "$h" = "$a" ]; then found=1; break; fi
  done
  if [ "$found" -eq 0 ]; then
    echo "adr-check: no decision in $page has the anchor \"$a\", cited at --" >&2
    echo "$cited" | awk -v a="$a" '$2 == a {printf "  %-10s %s\n", $1, $3}' | sort -u | head -5 >&2
    status=1
  fi
done

if [ "$status" -ne 0 ]; then
  echo >&2
  echo "The heading is the identifier; the number is a label with no registry to" >&2
  echo "allocate it from, which is how two branches once both reached for 0059." >&2
  echo "Prefer naming the heading -- CLAUDE.md and the newer docs already do." >&2
  exit 1
fi

echo "adr-check: $(echo "$pairs" | wc -l | tr -d ' ') numbers over $(echo "$cited" | wc -l | tr -d ' ') citations, each naming one of $(echo "$anchors" | wc -l | tr -d ' ') decisions"
'''

[tasks.bisect-check]
description = "Verify every commit builds, vets and tests green on its own, not just at HEAD. Checks each commit out into a temp tree so a commit cannot be green by accident of later work. Keeps `git bisect` trustworthy; it is the guard that is easiest to lose without noticing. Set BASE to limit the range, e.g. BASE=origin/main..HEAD."
run = '''
# mise runs tasks under `set -e`, so a command whose failure is expected must
# be guarded by `if`, not by reading $? afterwards — an earlier version died on
# the very first commit (which legitimately has no Go packages yet) and printed
# nothing at all, reporting a broken history that was in fact fine.
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
fail=0

for sha in $(git rev-list --reverse "${BASE:-HEAD}"); do
  short=$(git log -1 --format=%h "$sha")
  subject=$(git log -1 --format=%s "$sha")
  rm -rf "$tmp/wt"
  mkdir -p "$tmp/wt"
  git archive "$sha" | tar -x -C "$tmp/wt"

  if out=$(cd "$tmp/wt" && go build ./... 2>&1 && go vet ./... 2>&1 && go test ./... 2>&1); then
    printf "  %-9s PASS  %s\n" "$short" "$subject"
  elif printf "%s" "$out" | grep -qE "no packages to (test|vet)|matched no packages"; then
    # A commit before any Go package exists is legitimately empty, not broken.
    printf "  %-9s PASS  %s  (no packages yet)\n" "$short" "$subject"
  else
    printf "  %-9s FAIL  %s\n" "$short" "$subject"
    printf "%s" "$out" | tail -5 | sed 's/^/             /'
    fail=1
  fi
done

if [ "$fail" -ne 0 ]; then
  echo
  echo "history is not bisectable"
  exit 1
fi
echo
echo "every commit builds, vets and tests green in isolation"
'''

[tasks.ci]
description = "The full gate. A faithful mirror of .github/workflows/ci.yml: vet, lint, tidy-check, deps-check, generate-check, impact-check, eject-check, tagline-check, column-check, lint-check, adr-check, test-race, test-auth-workos, test-ts, test-dart, test-cli, test-pg, test-demo, test-fx. Formatting is checked inside lint, by the gofmt formatter in .golangci.yml, rather than by a gate of its own — docs/architecture.md, \"Tooling scoped to tracked files\". Needs the test databases, which test-pg starts. Does not include bisect-check, which is not part of CI at all — run it by hand with `mise run bisect-check` if a commit-by-commit history matters for what you're doing. NOTE: this is here to reproduce a CI failure, not to run before every push — CI runs the same checks in two parallel jobs, and running them locally is the same work done serially while starving the machine. `mise run preflight` is what belongs in the push path."
run = '''
set -e
mise run vet
mise run lint
mise run tidy-check
mise run deps-check
mise run generate-check
mise run impact-check
mise run eject-check
# The two gates here that check prose rather than code, in this list rather
# than beside it for the reason the others are. The tagline is the first
# sentence anyone reads about this project and it is written out by hand in
# four places that nothing links; the column reference is the only enumeration
# of the column vocabulary now that the guide points at it instead of
# repeating it, so nothing else would notice it falling behind the DSL.
mise run tagline-check
mise run column-check
mise run lint-check
mise run adr-check
mise run test-race
mise run test-auth-workos
mise run test-ts
mise run test-dart
mise run test-cli
# Last because they are the slowest and the only ones needing Docker. It is in the
# gate rather than beside it because a check nobody remembers to run is one this
# project has already lost once: the "Migrations and import" round-trip in
# docs/architecture.md was measured by hand, and the scripts that measured it
# are gone.
mise run test-pg
mise run test-demo
mise run test-fx
echo
echo "ci: all gates passed"
'''

# ---- Documentation site ----
#
# Deliberately not part of `ci`. The site is Astro, so running it in the gate
# would make Node a build dependency of a Go library whose whole argument is
# that it imposes none — the same reasoning that keeps sqlc out of the gate in
# example/withsqlc. The content is plain markdown in docs/guide either way, and
# it renders on GitHub without any of this.

[tasks.site-dev]
description = "Serve the documentation site with live reload. Regenerates the guide pages from docs/guide first; edit the markdown there, not the copy under site/src."
dir = "site"
run = '''
[ -d node_modules ] || npm install
npm run dev
'''

[tasks.site-build]
description = "Build the documentation site into site/dist, then verify every internal link in the output resolves. The link check is the load-bearing half: the guide's links are repo-relative and get rewritten for the web, so one can be valid markdown, survive the build, and still 404 after deploy."
dir = "site"
run = '''
[ -d node_modules ] || npm install
npm run build
'''

[tasks.site-check]
description = "Report whether docs/ can be published as it stands, without building. Fails on a link the rewriter has no rule for, on a page with no H1 to take a title from, and on a page missing from the sidebar order. Needs no npm install."
dir = "site"
run = "node scripts/sync-docs.mjs --check"
