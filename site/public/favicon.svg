<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="sqlb">
  <title>sqlb</title>
  <!-- Three rows and a predicate: a table with one row selected, which is the
       whole product in one mark. Currents colours are fixed rather than
       inherited so the icon reads the same in a light or dark browser chrome. -->
  <rect width="32" height="32" rx="7" fill="#1f2937" />
  <rect x="7" y="8" width="18" height="3.4" rx="1.7" fill="#94a3b8" />
  <rect x="7" y="14.3" width="18" height="3.4" rx="1.7" fill="#38bdf8" />
  <rect x="7" y="20.6" width="11" height="3.4" rx="1.7" fill="#94a3b8" />
</svg>
